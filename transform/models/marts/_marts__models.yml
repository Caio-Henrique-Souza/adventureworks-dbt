version: 2

models:
  - name: dim_date
    description: Calendário diário.
    columns:
      - name: date_day
        data_tests: [unique, not_null]

  - name: dim_customer
    description: Clientes (pessoa física ou revenda) com primeira e última compra.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: customer_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['Pessoa física', 'Revenda']

  - name: dim_product
    description: Produtos com categoria, subcategoria e modelo.
    columns:
      - name: product_id
        data_tests: [unique, not_null]

  - name: dim_territory
    description: Territórios de venda com país e grupo.
    columns:
      - name: territory_id
        data_tests: [unique, not_null]

  - name: fct_sales
    description: Fato de vendas no grão de item de pedido, com valores bruto, desconto, líquido, custo e margem (USD).
    columns:
      - name: sales_order_line_id
        data_tests: [unique, not_null]
      - name: order_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id
      - name: territory_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_territory')
                field: territory_id
      - name: net_amount
        data_tests: [not_null]

  - name: fct_sales_vs_target_monthly
    description: Realizado x meta por território e mês (meta vinda do Excel).
    data_tests:
      - dbt_utils_free_unique_combination:
          arguments:
            columns: [month_start, territory_name]
    columns:
      - name: target_amount
        description: Meta do mês. Nula quando o território vendeu num mês sem meta cadastrada.
